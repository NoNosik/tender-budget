<meta charset="utf-8">
<title>Тендерный бюджет</title>
<style>
:root{
  --ground:#E8ECEE; --surface:#FFFFFF; --surface-2:#F3F5F7; --sunken:#F0F2F4;
  --line:#E6EAEC; --line-strong:#C9D0D5;
  --ink:#15181B; --text:#23282C; --muted:#5F676D; --faint:#8A9299;
  --p-auto:#2E7357; --p-auto-bg:#E7F1EC; --p-auto-line:#B9D6C8;
  --p-manual:#8E6A12; --p-manual-bg:#F6EEDA; --p-manual-line:#E0CB98;
  --p-tender:#2A5F96; --p-tender-bg:#E6EEF6; --p-tender-line:#B6CDE3;
  --p-missing:#A63E2B; --p-missing-bg:#F7E9E5; --p-missing-line:#E5BFB5;
  --ramp-1:#3D454B; --ramp-2:#5A646B; --ramp-3:#7B858C; --ramp-4:#9BA4AA; --ramp-5:#BDC4C9;
  --shadow:0 1px 2px rgba(21,24,27,.05), 0 6px 16px -10px rgba(21,24,27,.18);
  --sans:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono","SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0C0F12; --surface:#171B1F; --surface-2:#1C2126; --sunken:#13171A;
    --line:#232A2F; --line-strong:#39424A;
    --ink:#F2F4F5; --text:#DDE2E5; --muted:#98A1A8; --faint:#767F86;
    --p-auto:#63B894; --p-auto-bg:#16281F; --p-auto-line:#2C4E3D;
    --p-manual:#D9AE4B; --p-manual-bg:#2A2213; --p-manual-line:#4E4126;
    --p-tender:#74A9D8; --p-tender-bg:#152230; --p-tender-line:#2A4058;
    --p-missing:#E08167; --p-missing-bg:#2C1913; --p-missing-line:#523027;
    --ramp-1:#C9D0D5; --ramp-2:#A6AEB4; --ramp-3:#848D94; --ramp-4:#646D74; --ramp-5:#464F56;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 16px -10px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --ground:#0C0F12; --surface:#171B1F; --surface-2:#1C2126; --sunken:#13171A;
  --line:#232A2F; --line-strong:#39424A;
  --ink:#F2F4F5; --text:#DDE2E5; --muted:#98A1A8; --faint:#767F86;
  --p-auto:#63B894; --p-auto-bg:#16281F; --p-auto-line:#2C4E3D;
  --p-manual:#D9AE4B; --p-manual-bg:#2A2213; --p-manual-line:#4E4126;
  --p-tender:#74A9D8; --p-tender-bg:#152230; --p-tender-line:#2A4058;
  --p-missing:#E08167; --p-missing-bg:#2C1913; --p-missing-line:#523027;
  --ramp-1:#C9D0D5; --ramp-2:#A6AEB4; --ramp-3:#848D94; --ramp-4:#646D74; --ramp-5:#464F56;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 16px -10px rgba(0,0,0,.6);
}

*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:600;color:var(--ink);text-wrap:balance}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--p-tender);outline-offset:2px;border-radius:3px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}

.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);font-weight:500}

/* ---------- topbar ---------- */
.topbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:11px 24px;background:var(--surface)}
.brand{font-size:15px;font-weight:600;color:var(--ink);letter-spacing:-.01em;
  padding-right:16px;border-right:1px solid var(--line)}
.brand span{color:var(--faint);font-weight:400}
.proto{margin-left:auto;display:flex;gap:10px;align-items:center}
.tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;
  padding:3px 7px;background:var(--sunken);color:var(--muted);border-radius:3px}
.verline{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;
  padding:0 24px 9px;background:var(--surface);font-size:11.5px;color:var(--faint)}
.verline a{color:var(--muted)}

/* ---------- хлебные крошки и переключатель блока ---------- */
.crumbs{display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap}
.crumb{background:none;border:0;padding:3px 6px;margin-left:-6px;border-radius:4px;cursor:pointer;
  font-size:13px;color:var(--muted)}
.crumb:hover{background:var(--sunken);color:var(--ink)}
.sep{color:var(--line-strong);font-size:13px}
.crumb-cur{font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap}

/* ---------- строка фактов объекта ---------- */
.objbar{display:flex;gap:18px;flex-wrap:wrap;align-items:baseline;
  padding:0 24px 12px;background:var(--surface);font-size:12.5px;color:var(--muted)}
.objbar b{font-weight:500;color:var(--text);font-family:var(--mono);font-size:12px}

/* ---------- список объектов ---------- */
.list-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;
  flex-wrap:wrap;margin-bottom:18px}
tr.obj-row{cursor:pointer}
tr.obj-row[aria-current="true"]{background:var(--sunken)}
tr.obj-row[aria-current="true"] td:first-child{box-shadow:inset 2px 0 0 var(--ink)}
.stage-pill{display:inline-block;padding:2px 8px;border-radius:3px;background:var(--sunken);
  font-size:11px;color:var(--muted);white-space:nowrap}
.stage-pill.now{background:var(--ink);color:var(--ground);font-weight:500}
.obj-name{font-weight:500;color:var(--ink)}
.obj-sub{font-size:11px;color:var(--faint);margin-top:1px}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:minmax(0,1fr) 296px;gap:0;align-items:start}
.shell.wide{grid-template-columns:minmax(0,1fr)}
.stage{padding:24px 28px 64px;min-width:0}
.summary{position:sticky;top:0;padding:18px 20px 40px;background:var(--surface);
  min-height:calc(100vh - 150px)}

/* ---------- горизонтальный трекер ---------- */
.tracker{background:var(--surface);border-bottom:1px solid var(--line);padding:13px 24px 0}
.tracker-head{display:flex;justify-content:space-between;align-items:baseline;gap:18px;
  flex-wrap:wrap;padding-bottom:14px}
.legend{display:flex;gap:15px;flex-wrap:wrap}
.legend span{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--muted)}
.swatch{width:9px;height:9px;border-radius:50%;flex:none}

.tr-wrap{overflow-x:auto}
.tr{position:relative;min-width:900px;padding-bottom:16px}
.track{position:absolute;left:6.25%;right:6.25%;top:15px;height:2px;background:var(--line-strong);border-radius:1px}
.track .fill{position:absolute;left:0;top:0;height:100%;background:var(--ink);border-radius:1px;
  transition:width .28s cubic-bezier(.4,0,.2,1)}
.tsteps{list-style:none;margin:0;padding:0;display:flex;position:relative}
.tstep{flex:1 1 0;min-width:0}
.tstep button{width:100%;background:none;border:0;padding:0 4px 4px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:9px;border-radius:6px}
.tdot{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none;
  font-family:var(--mono);font-size:12.5px;font-weight:500;line-height:1;
  background:var(--surface);border:2px solid var(--line-strong);color:var(--faint);
  box-shadow:0 0 0 5px var(--surface);transition:box-shadow .2s ease}
.tstep button:hover .tdot{border-color:var(--faint)}
.tlabel{font-size:12px;line-height:1.3;color:var(--muted);text-align:center;text-wrap:balance}
.tval{font-family:var(--mono);font-size:10.5px;color:var(--faint);text-align:center;margin-top:-4px}

.tstep[data-st] .tdot{color:var(--surface)}
.tstep[data-st] .tlabel{color:var(--text)}
.tstep[data-st="done"] .tdot{background:var(--p-auto);border-color:var(--p-auto)}
.tstep[data-st="manual"] .tdot{background:var(--p-manual);border-color:var(--p-manual)}
.tstep[data-st="tender"] .tdot{background:var(--p-tender);border-color:var(--p-tender)}
.tstep[data-st="missing"] .tdot{background:var(--p-missing);border-color:var(--p-missing)}
.tstep[data-st="manual"] .tval.attn{color:var(--p-manual)}
.tstep[data-st="tender"] .tval.attn{color:var(--p-tender)}
.tstep[data-st="missing"] .tval.attn{color:var(--p-missing)}

.tstep.active .tdot{box-shadow:0 0 0 4px var(--surface),0 0 0 6px var(--ink)}
.tstep.active .tlabel{font-weight:600;color:var(--ink)}

/* ---------- stage ---------- */
.stage-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;
  padding-bottom:14px;margin-bottom:20px;border-bottom:1px solid var(--line)}
.stage-title{font-size:22px;letter-spacing:-.015em}
.stage-sub{font-size:13px;color:var(--muted);max-width:62ch;margin-top:5px}
.stage-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:7px 13px;border-radius:4px;border:1px solid var(--line-strong);background:var(--surface);
  cursor:pointer;font-size:12.5px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn-primary{background:var(--ink);border-color:var(--ink);color:var(--ground)}
.btn-primary:hover{opacity:.88}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-sm{padding:3px 9px;font-size:11.5px}

.panel{background:var(--surface);border-radius:8px;margin-bottom:14px}
.panel.sect{border:1px solid var(--line-strong)}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  padding:11px 14px;border-bottom:1px solid var(--line)}
.panel-body{padding:14px}
.panel-body.tight{padding:0}
.sect-mark{font-family:var(--mono);font-size:10.5px;color:var(--surface);background:var(--ramp-2);
  border-radius:3px;padding:1px 6px;margin-right:8px}

details.fold{background:var(--surface);border-radius:8px;margin-bottom:14px}
details.fold>summary{list-style:none;cursor:pointer;padding:11px 14px;
  display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:1px solid transparent}
details.fold>summary::-webkit-details-marker{display:none}
details.fold[open]>summary{border-bottom-color:var(--line)}
details.fold>summary::after{content:"развернуть";font-family:var(--mono);font-size:10.5px;color:var(--faint)}
details.fold[open]>summary::after{content:"свернуть"}
details.fold .fold-body{padding:14px}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:1px;background:var(--line)}
.cell{background:var(--surface);padding:12px 14px}
.cell .v{font-size:19px;font-weight:600;color:var(--ink);letter-spacing:-.01em;margin-top:3px}
.cell .u{font-size:11.5px;color:var(--faint);margin-top:1px}

table{width:100%;border-collapse:collapse;font-size:12.5px}
.tw{overflow-x:auto}
th{text-align:left;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--faint);font-weight:500;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
.r{text-align:right}
td.art{font-family:var(--mono);font-size:11.5px;color:var(--text);white-space:nowrap}
tfoot td{border-top:1px solid var(--line-strong);border-bottom:0;font-weight:600;color:var(--ink);padding-top:10px}
tr.sub td{color:var(--muted);background:var(--sunken)}
tr.sub td:first-child{padding-left:26px}

.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 7px;border-radius:3px;
  font-size:11px;font-weight:500;white-space:nowrap;border:1px solid transparent}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.p-auto{color:var(--p-auto);background:var(--p-auto-bg);border-color:var(--p-auto-line)}
.p-manual{color:var(--p-manual);background:var(--p-manual-bg);border-color:var(--p-manual-line)}
.p-tender{color:var(--p-tender);background:var(--p-tender-bg);border-color:var(--p-tender-line)}
.p-missing{color:var(--p-missing);background:var(--p-missing-bg);border-color:var(--p-missing-line)}
.pill.plain::before{display:none}

/* карантин: рамка поверх прежнего фона, фон не меняется */
.pill.quar{border:2px solid var(--p-missing);border-radius:4px}
.quar-addr{display:block;font-family:var(--mono);font-size:10px;color:var(--p-missing);margin-top:3px;white-space:nowrap}

/* добивочные строки: серые, не зелёные */
.pill.bal{color:var(--muted);background:var(--sunken);border-color:var(--line-strong)}
.bal-note{display:block;font-size:10.5px;color:var(--faint);margin-top:2px}

/* условные числа */
.cond{border-bottom:1px dashed var(--p-manual);cursor:help}
.cond-mark{font-family:var(--mono);font-size:9.5px;color:var(--p-manual);
  text-transform:uppercase;letter-spacing:.06em;margin-left:5px}

.kv{display:grid;gap:0}
.kv div{display:flex;justify-content:space-between;gap:16px;padding:7px 0;border-bottom:1px solid var(--line)}
.kv div:last-child{border-bottom:0}
.kv dt,.kv .k{color:var(--muted);font-size:12.5px}
.kv .v{font-family:var(--sans);font-variant-numeric:tabular-nums;font-size:12.5px;font-weight:500;color:var(--ink)}

.field{display:flex;align-items:center;gap:8px}
input[type=text],input[type=number],select{font:inherit;font-variant-numeric:tabular-nums;text-align:right;
  width:100%;max-width:130px;padding:5px 8px;border-radius:4px;background:var(--p-manual-bg);
  border:1px solid var(--p-manual-line);color:var(--ink)}
select{text-align:left}
input[type=text]:focus,input[type=number]:focus,select:focus{outline:2px solid var(--p-manual);outline-offset:1px}
input.auto-in,select.auto-in{background:var(--surface);border-color:var(--line-strong);color:var(--muted)}
input.wide{max-width:none}
.req-star{color:var(--p-missing);margin-left:2px}
.field-lbl{font-size:11.5px;color:var(--muted);margin-bottom:4px}
.field-note{font-size:11px;color:var(--faint);margin-top:4px}

.chk{display:flex;gap:9px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.chk:last-child{border-bottom:0}
.chk input{margin:3px 0 0;accent-color:var(--ink);width:14px;height:14px;flex:none}
.chk .body{flex:1;min-width:0}
.chk .nm{font-size:12.5px;color:var(--text)}
.chk .sub{font-size:11px;color:var(--faint);margin-top:1px}
.chk .amt{font-variant-numeric:tabular-nums;font-size:12.5px;font-weight:500;color:var(--ink);white-space:nowrap}
.chk.locked{cursor:default;opacity:.92}

.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:4px;overflow:hidden}
.seg button{padding:6px 12px;background:var(--surface);border:0;cursor:pointer;font-size:12.5px;
  border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--ground);font-weight:500}
.seg.sm button{padding:4px 9px;font-size:11.5px}

.stagebar{display:flex;height:26px;border-radius:4px;overflow:hidden}
.stagebar span{display:grid;place-items:center;font-family:var(--mono);font-size:10.5px;color:var(--surface);
  border-right:1px solid var(--surface)}
.stagebar span:last-child{border-right:0}

.note{font-size:12px;color:var(--muted);padding:10px 14px;background:var(--sunken);
  border-left:2px solid var(--line-strong);border-radius:0 4px 4px 0;margin-top:4px}
.note b{color:var(--text);font-weight:500}
.note+.note{margin-top:8px}
.note.hands{border-left-color:var(--p-manual)}
.note.what{border-left-color:var(--p-tender)}

.drift{font-size:11px;color:var(--p-missing);white-space:nowrap}
.drift b{font-weight:600}

.expander{background:none;border:0;cursor:pointer;color:var(--faint);font-family:var(--mono);
  font-size:11px;padding:0 6px 0 0}
.expander[aria-expanded="true"]{color:var(--ink)}

.stepnav{display:flex;justify-content:space-between;align-items:center;gap:12px;
  margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.stepnav .hint{font-size:11.5px;color:var(--faint)}

/* ---------- summary rail ---------- */
.sum-block{margin-bottom:18px}
.sum-big{font-size:26px;font-weight:600;color:var(--ink);letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.sum-unit{font-size:11.5px;color:var(--faint);margin-top:2px}
.slider-top{display:flex;justify-content:space-between;align-items:baseline}
.slider-val{font-family:var(--mono);font-size:15px;font-weight:500;color:var(--ink)}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--ink);background:transparent}
.scale{position:relative;height:16px;margin-top:1px}
.scale .tick{position:absolute;top:0;transform:translateX(-50%);font-family:var(--mono);font-size:10px;color:var(--faint);white-space:nowrap}
.scale .floor{color:var(--p-missing)}
.scale .floor::before{content:"";position:absolute;left:50%;top:-9px;width:1px;height:7px;background:var(--p-missing)}
.res{display:grid;gap:0;margin-top:6px}
.res div{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.res div:last-child{border-bottom:0}
.res .k{font-size:12px;color:var(--muted)}
.res .v{font-variant-numeric:tabular-nums;font-size:12.5px;font-weight:500;color:var(--ink)}
.res .v.neg{color:var(--p-missing)}
.res .v.pos{color:var(--p-auto)}
.warn{margin-top:10px;font-size:11.5px;padding:9px 11px;border-radius:5px;
  background:var(--p-missing-bg);color:var(--p-missing)}
.ok-line{margin-top:10px;font-size:11.5px;padding:9px 11px;border-radius:5px;
  background:var(--p-auto-bg);color:var(--p-auto)}
.blk-line{font-size:11px;color:var(--faint);margin-top:8px}

.contract-in{display:flex;gap:8px;align-items:center;margin-top:8px}
.contract-in input{max-width:none;flex:1;background:var(--surface);border-color:var(--line-strong)}

/* ---------- модальное окно ---------- */
.overlay{position:fixed;inset:0;z-index:60;background:rgba(21,24,27,.45);
  display:grid;place-items:center;padding:20px}
.overlay[hidden]{display:none}
[hidden]{display:none!important}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);
  width:min(780px,100%);max-height:88vh;display:flex;flex-direction:column}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
  padding:15px 18px;border-bottom:1px solid var(--line)}
.modal-head h2{font-size:16px}
.modal-sub{font-size:12px;color:var(--muted);margin-top:3px}
.modal-body{padding:16px 18px;overflow:auto}
.modal-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:12px 18px;border-top:1px solid var(--line)}
.modal-foot .right{display:flex;gap:8px;margin-left:auto}
.x{background:none;border:0;cursor:pointer;font-size:17px;color:var(--faint);line-height:1;padding:2px 6px}
.x:hover{color:var(--ink)}
.letter{background:var(--sunken);border-radius:6px;padding:13px 15px;font-size:12.5px;
  color:var(--text);white-space:pre-wrap;line-height:1.55}

/* ---------- поставщики ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.card{background:var(--surface);border-radius:8px;padding:14px 15px 12px}
.card h3{font-size:14px;letter-spacing:-.01em}
.card .geo{font-size:11.5px;color:var(--faint);margin-top:2px}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin:9px 0 4px}
.chip{font-size:10.5px;padding:2px 7px;border-radius:3px;background:var(--sunken);color:var(--muted);white-space:nowrap}
.contact{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}
.contact:last-of-type{border-bottom:0}
.contact .who{font-size:12.5px;color:var(--text)}
.contact .role{font-size:10.5px;color:var(--faint);margin-top:1px}
.contact .co{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:right;white-space:nowrap;line-height:1.6}
.card-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;
  margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.card-foot .st{font-size:11px;color:var(--faint)}

function othTotal(){
  return ARTICLES.reduce(function(s, a){
    return s + (a.on && a.dir === OTH ? artAcc(a) : 0);
  }, 0);
}
function fundsTotal(){ return (state.marketing + state.funds) * (1 + P('marketing_rate')); }

/* ---- сводная модель и расчёт ------------------------------------- */
function baseCost(){
  return matTotal() + mountTotal() + manTotal() + PRJ_VSTR + othTotal() + fundsTotal();
}
function mdl(){
  var k = factor();
  return {k:k, S:S_VSTR * k, C:baseCost() * k,
          vatIn:VAT_IN_VSTR * k, gen:GEN_VSTR * k, adm:ADM_VSTR * k};
}
function vatRate(){ return (state.country === 'Узбекистан' ? P('vat_uz') : P('vat_ru')) / 100; }

function calcOn(M, V, m){
  var K = M.C * (1 + m);
  var income = M.C * m;
  var ovh = OVH * (K - M.gen - M.adm);
  var vatOut = K * V / (1 + V) - M.vatIn;
  var hold = HOLD * K;
  var margin = income - ovh - vatOut;
  var profit = margin * (1 - PROFIT_TAX);
  return {K:K, C:M.C, S:M.S, income:income, ovh:ovh, vatOut:vatOut, hold:hold,
          margin:margin, profit:profit, cf:profit - hold};
}
function calc(m){ return calcOn(mdl(), vatRate(), m); }
function floorM(){
  var M = mdl(), V = vatRate();
  for (var m = 0.15; m <= 0.9; m += 0.0005) if (calcOn(M, V, m).cf >= 0) return m;
  return 0.31;
}

}

/* ==================================================================
   Шаг 8. Финансовый план
   Раскладка по месяцам не переделывалась: ждём замечаний
   руководителей проектов со встречи 09.09.
   ================================================================== */
var FIN = {
  months:['окт 26','ноя 26','дек 26','янв 27','фев 27','мар 27','апр 27','май 27'],
  rows:[
    {k:'proj', name:'Проектирование и геодезия', d:[55,35,10,0,0,0,0,0],
     hint:'обмеры и рабочая документация в начале'},
    {k:'mat',  name:'Материалы и закупка',       d:[10,18,20,18,17,17,0,0],
     hint:'предоплаты поставщикам и поставки на объект'},
    {k:'man',  name:'Изготовление',              d:[4,16,20,20,20,20,0,0],
     hint:'по загрузке производства'},
    {k:'mnt',  name:'Монтаж',                    d:[0,10,15,17,18,17,15,8],
     hint:'по процентовке этапов с шага монтажа'},
    {k:'oth',  name:'Прочие расходы',            d:[13,13,13,13,12,12,12,12],
     hint:'бытовки, техника, вывоз мусора — помесячно'}
  ],
  work:[10,16,16,15,15,12,10,6],
  avans:0, delay:30, hold:5,
  edited:{}, unit:'pct'
};
var FIN_SUM = {
  proj: function(k){ return PRJ_VSTR * k; },
  mat:  function(k){ return matTotal() * k; },
  man:  function(k){ return manTotal() * k; },
  mnt:  function(k){ return mountTotal() * k; },
  oth:  function(k){ return (othTotal() + fundsTotal()) * k; }
};

function finCalc(avans, delay){
  var r = calc(state.m), K = r.K, n = FIN.months.length, k = factor();
  avans = (avans === undefined ? FIN.avans : avans);
  delay = (delay === undefined ? FIN.delay : delay);

  var outRows = FIN.rows.map(function(row){
    var sum = FIN_SUM[row.k](k);
    return {name:row.name, k:row.k, hint:row.hint, sum:sum, d:row.d,
            arr:row.d.map(function(p){ return sum * p / 100; })};
  });

  var act = FIN.work.map(function(p){ return K * p / 100; });
  var actSum = act.reduce(function(a,b){ return a + b; }, 0);

  var ovhArr = [], vatArr = [];
  for (var i = 0; i < n; i++){
    ovhArr.push(r.ovh / n);
    vatArr.push(actSum ? r.vatOut * act[i] / actSum : 0);
  }
  outRows.push({name:'Накладные 10 %', k:'ovh', derived:true, sum:r.ovh, arr:ovhArr,
                hint:'считаются от цены контракта, делятся ровно'});
  outRows.push({name:'НДС к уплате', k:'vat', derived:true, sum:r.vatOut, arr:vatArr,
                hint:'привязан к закрытым актам'});
  var tax = r.margin - r.profit;
  outRows.push({name:'Налог на прибыль 25 %', k:'tax', derived:true, sum:tax,
                arr:act.map(function(a){ return actSum ? tax * a / actSum : 0; }),
                hint:'платится по мере закрытия актов'});

  var outflow = [], inflow = [], i2;
  for (i2 = 0; i2 < n; i2++) outflow.push(0), inflow.push(0);
  outRows.forEach(function(row){ row.arr.forEach(function(v, i){ outflow[i] += v; }); });

  var av = K * avans / 100;
  inflow[0] += av;
  var share = 1 - avans / 100 - FIN.hold / 100;
  var lag = delay / 30, li = Math.floor(lag), fr = lag - li, tail = 0;
  act.forEach(function(a, i){
    var v = a * share, i1 = i + li, iN = i + li + 1;
    var p1 = v * (1 - fr), p2 = v * fr;
    if (i1 < n) inflow[i1] += p1; else tail += p1;
    if (fr > 0){ if (iN < n) inflow[iN] += p2; else tail += p2; }
  });

  var bal = [], acc = 0, minB = Infinity, minI = 0;
  for (var j = 0; j < n; j++){
    acc += inflow[j] - outflow[j];
    bal.push(acc);
    if (acc < minB){ minB = acc; minI = j; }
  }
  return {K:K, n:n, rows:outRows, act:act, inflow:inflow, outflow:outflow, bal:bal,
          min:minB, minI:minI, tail:tail, avansSum:av, holdSum:K * FIN.hold / 100, r:r};
}

function needAvans(){
  for (var a = 0; a <= 60; a += 0.5)
    if (finCalc(a, FIN.delay).min >= 0) return a;
  return null;
}

function finChart(F){
  var n = F.n, W = 780, H = 300, L = 62, R = 14, T = 16, B = 48;
  var iw = W - L - R, ih = H - T - B, bw = iw / n;
  var top = 0, bot = 0;
  for (var i = 0; i < n; i++){
    top = Math.max(top, F.inflow[i], F.outflow[i], F.bal[i]);
    bot = Math.min(bot, F.bal[i]);
  }
  top = top * 1.1; bot = bot * 1.18;
  if (top === bot) top = 1;
  var y = function(v){ return T + ih * (top - v) / (top - bot); };
  var zero = y(0);

  var bands = '', bars = '', pts = [], labels = '';
  for (var k = 0; k < n; k++){
    var x0 = L + bw * k;
    if (F.bal[k] < 0)
      bands += '<rect x="' + x0.toFixed(1) + '" y="' + T + '" width="' + bw.toFixed(1) + '" height="' + ih +
               '" fill="var(--p-missing-bg)"/>';
    var w = bw * 0.26, gap = bw * 0.07;
    var xi = x0 + bw / 2 - w - gap / 2, xo = x0 + bw / 2 + gap / 2;
    bars += '<rect x="' + xi.toFixed(1) + '" y="' + y(F.inflow[k]).toFixed(1) + '" width="' + w.toFixed(1) +
            '" height="' + Math.max(0, zero - y(F.inflow[k])).toFixed(1) + '" fill="var(--p-auto)" rx="2"/>' +
            '<rect x="' + xo.toFixed(1) + '" y="' + y(F.outflow[k]).toFixed(1) + '" width="' + w.toFixed(1) +
            '" height="' + Math.max(0, zero - y(F.outflow[k])).toFixed(1) + '" fill="var(--ramp-3)" rx="2"/>';
    pts.push((x0 + bw / 2).toFixed(1) + ',' + y(F.bal[k]).toFixed(1));
    labels += '<text class="lbl" x="' + (x0 + bw / 2).toFixed(1) + '" y="' + (H - 26) + '" text-anchor="middle">' +
              FIN.months[k] + '</text>';
    labels += '<text x="' + (x0 + bw / 2).toFixed(1) + '" y="' + (H - 12) + '" text-anchor="middle" fill="' +
              (F.bal[k] < 0 ? 'var(--p-missing)' : 'var(--muted)') + '">' +
              (F.bal[k] / 1e6).toFixed(1).replace('.', ',') + '</text>';
  }
  var dots = pts.map(function(p, i){
    var c = p.split(',');
    return '<circle cx="' + c[0] + '" cy="' + c[1] + '" r="3.5" fill="' +
      (F.bal[i] < 0 ? 'var(--p-missing)' : 'var(--ink)') + '"/>';
  }).join('');

  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Движение денежных средств по месяцам">' +
    bands +
    '<line x1="' + L + '" y1="' + zero.toFixed(1) + '" x2="' + (W - R) + '" y2="' + zero.toFixed(1) +
      '" stroke="var(--line-strong)" stroke-width="1"/>' +
    bars +
    '<polyline points="' + pts.join(' ') + '" fill="none" stroke="var(--ink)" stroke-width="2" ' +
      'stroke-linejoin="round" stroke-linecap="round"/>' + dots +
    '<text x="' + (L - 8) + '" y="' + (y(top * 0.92) + 3).toFixed(1) + '" text-anchor="end">' +
      (top / 1e6).toFixed(0) + ' млн</text>' +
    '<text x="' + (L - 8) + '" y="' + (zero + 3).toFixed(1) + '" text-anchor="end">0</text>' +
    (bot < 0 ? '<text x="' + (L - 8) + '" y="' + (y(bot * 0.92) + 3).toFixed(1) + '" text-anchor="end" fill="var(--p-missing)">' +
      (bot / 1e6).toFixed(0) + ' млн</text>' : '') +
    labels + '</svg>';
}

/* ==================================================================
   Экраны и отрисовка
   ================================================================== */
views[STEP.ozm]    = function(){ return views_1(); };
views[STEP.price]  = function(){ return views_2(); };
views[STEP.tender] = function(){ return views_3(); };
views[STEP.prod]   = function(){ return views_4(); };
views[STEP.mount]  = function(){ return views_5(); };
views[STEP.extras] = function(){ return views_6(); };
views[STEP.budget] = function(){ return views_7(); };
views[STEP.fin]    = function(){ return views_8(); };

function renderStage(){
  document.getElementById('stage').innerHTML =
    state.mode === 'list' ? objectsView() :
    state.mode === 'sup'  ? suppliersView() : views[state.step]();
}

function row(k, v, cls){
  return '<div><span class="k">'+k+'</span><span class="v'+(cls?' '+cls:'')+'">'+f(v)+' ₽</span></div>';
}

function renderSummary(){
  var M = mdl(), r = calc(state.m), fm = floorM();
  document.getElementById('cost').textContent = f(M.C) + ' ₽';
  document.getElementById('costM2').textContent = f2(M.C/M.S) + ' ₽/м² · ' + f2(M.S) + ' м²';
  document.getElementById('blkLine').textContent = 'блок: ' + BLOCK_NAMES[state.block] +
    (state.block === 'vstr' ? '' : ' · навеска условная, В8');
  document.getElementById('mVal').textContent = pc(state.m);
  document.getElementById('priceM2').textContent = f2(r.K/M.S) + ' ₽/м²';
  if (document.activeElement !== document.getElementById('contract'))
    document.getElementById('contract').value = f(r.K);
  document.getElementById('res').innerHTML =
    row('Накладные 10 %', -r.ovh) + row('НДС к уплате', -r.vatOut) +
    row('Удержание 5 %', -r.hold) +
    row('Чистая прибыль', r.profit, r.profit>=0?'pos':'neg') +
    row('Живые деньги', r.cf, r.cf>=0?'pos':'neg');
  document.getElementById('verdict').innerHTML = r.cf >= 0
    ? '<div class="ok-line">Запас до дна '+pc(state.m-fm)+' наценки — можно падать до '+f(M.C*(1+fm))+' ₽</div>'
    : '<div class="warn"><b>Зачем нам завтрашний день?</b> Ниже дна: своих денег в объект '+
      'придётся доложить '+f(-r.cf)+' ₽</div>';
  var ft = document.getElementById('floorTick');
  ft.style.left = ((fm*100 - 15)/(70-15)*100) + '%';
  ft.textContent = 'дно ' + pc(fm);
}

function renderAll(){ renderRail(); renderCrumbs(); renderStage(); renderSummary(); }

function setMode(mode){
  state.mode = mode;
  var list = mode !== 'object';
  document.getElementById('tracker').hidden = list;
  document.getElementById('objbar').hidden = list;
  document.getElementById('summary').hidden = list;
  document.getElementById('shell').classList.toggle('wide', list);
  renderAll();
  if (list){ document.getElementById('objbar').hidden = true; }
  if (window.pageYOffset) window.scrollTo(0, 0);
}

function goStep(n){
  if (n < 1 || n > LAST_STEP) return;
  if (n > STEP.ozm && !formOk()) n = STEP.ozm;
  state.mode = 'object';
  document.getElementById('tracker').hidden = false;
  document.getElementById('objbar').hidden = false;
  document.getElementById('summary').hidden = false;
  document.getElementById('shell').classList.remove('wide');
  state.step = n;
  renderAll();
}

/* ---- разбор чисел ------------------------------------------------- */
function num(v){
  var x = parseFloat(String(v).replace(/\s| /g, '').replace(',', '.'));
  return isNaN(x) ? null : x;
}

/* ---- события ------------------------------------------------------ */
document.getElementById('steps').addEventListener('click', function(e){
  var b = e.target.closest('[data-step]'); if(!b) return;
  goStep(+b.dataset.step);
});

document.getElementById('blockPick').addEventListener('click', function(e){
  var b = e.target.closest('[data-block]'); if(!b) return;
  state.block = b.dataset.block;
  renderAll();
});

document.addEventListener('click', function(e){
  var nav = e.target.closest('[data-nav]');
  if (nav) setMode(nav.dataset.nav === 'sup' ? 'sup' : 'list');
});

document.getElementById('stage').addEventListener('click', function(e){
  var t;
  if ((t = e.target.closest('[data-go]'))){
    if (t.disabled) return;
    goStep(+t.dataset.go); return;
  }
  if (e.target.closest('[data-passport]')){ passportModal(); return; }
  if (e.target.closest('[data-supply]')){ supplyModal(); return; }
  if (e.target.closest('[data-old-form]')){ oldFormModal(); return; }
  if ((t = e.target.closest('[data-kp]'))){ kpModal(t.dataset.kp); return; }
  if ((t = e.target.closest('[data-remind]'))){ requestModal(t.dataset.remind); return; }
  if ((t = e.target.closest('[data-metiz]'))){ state.metiz = t.dataset.metiz; renderAll(); return; }
  if ((t = e.target.closest('[data-dir]'))){ state.dirForm = t.dataset.dir; renderStage(); return; }
  if ((t = e.target.closest('[data-open]'))){
    var key = t.dataset.open;
    state.open[key] = !state.open[key];
    renderStage(); return;
  }
  if (e.target.closest('[data-add-art]')){
    ARTICLES.push({k:'new'+(ARTICLES.length+1), n:'Новая статья', req:'optional', on:false, dir:OTH,
                   rec:0, acc:0, src:'заведена руками ' + TODAY, note:'опишите статью и поставьте сумму'});
    renderAll(); return;
  }
  if ((t = e.target.closest('[data-req]'))){ requestModal(t.dataset.req); return; }
  if ((t = e.target.closest('[data-sup-req]'))){
    var v = t.dataset.supReq.split('|'); requestModal(v[0], v[1]); return;
  }
  if ((t = e.target.closest('[data-req-open]'))){ reqDetailModal(+t.dataset.reqOpen); return; }
  if (e.target.closest('[data-fin-unit]')){
    FIN.unit = FIN.unit === 'pct' ? 'rub' : 'pct'; renderStage(); return;
  }
  if ((t = e.target.closest('[data-scn]'))){
    var s = SCENARIOS[+t.dataset.scn];
    FIN.avans = s.a; FIN.delay = s.d; renderStage(); return;
  }
  if (state.mode === 'list' && e.target.closest('[data-obj]')){ goStep(state.step); return; }
});

/* правка обязательных полей: кнопку «Дальше» гасим сразу, без перерисовки */
document.getElementById('stage').addEventListener('input', function(e){
  var i = e.target;
  if (!i.dataset || !i.dataset.field) return;
  state.form[i.dataset.field] = i.value;
  if (i.dataset.field === 'country') state.country = i.value;
  var nx = document.getElementById('btnNext');
  if (nx) nx.disabled = !formOk();
});

document.getElementById('stage').addEventListener('change', function(e){
  var i = e.target, d = i.dataset || {}, x;

  if (d.field){
    state.form[d.field] = i.value;
    if (d.field === 'country') state.country = i.value;
    renderAll(); return;
  }
  if (d.param){
    x = num(i.value);
    if (x === null){ renderAll(); return; }
    PARAMS[d.param].value = x; paramEdited[d.param] = true;
    renderAll(); return;
  }
  if (i.hasAttribute('data-target')){
    x = num(i.value);
    if (x === null || x < 0){ renderAll(); return; }
    state.target = x / 100; renderAll(); return;
  }
  if (d.tprice){
    x = num(i.value);
    TEND.forEach(function(r){ if (r.k === d.tprice && x !== null) r.price = x; });
    renderAll(); return;
  }
  if (d.man){
    x = num(i.value);
    MAN.forEach(function(r){ if (r.k === d.man && x !== null){ r.rate = x; r.hand = 1; } });
    renderAll(); return;
  }
  if (d.mnt){
    x = num(i.value);
    MOUNT.forEach(function(r){ if (r.k === d.mnt && x !== null){ r.rate = x; r.hand = 1; } });
    renderAll(); return;
  }
  if (d.ip){
    x = num(i.value);
    MOUNT.forEach(function(r){ if (r.k === d.ip && x !== null) r.ip = Math.max(0, Math.min(100, x)); });
    renderAll(); return;
  }
  if (d.acc){
    x = num(i.value);
    ARTICLES.forEach(function(a){ if (a.k === d.acc && x !== null){ a.acc = x; a.accEdited = 1; } });
    renderAll(); return;
  }
  if (d.art){
    var art = null;
    ARTICLES.forEach(function(a){ if (a.k === d.art) art = a; });
    if (!art) return;
    art.on = i.checked;
    if (art.req === 'choose_one' && i.checked)
      ARTICLES.forEach(function(a){ if (a !== art && a.grp === art.grp) a.on = false; });
    renderAll(); return;
  }
  if (i.hasAttribute('data-mk')){
    x = num(i.value); state.marketing = x === null ? 0 : x; renderAll(); return;
  }
  if (i.hasAttribute('data-fn')){
    x = num(i.value); state.funds = x === null ? 0 : x; renderAll(); return;
  }
  if (d.fin){
    x = num(i.value);
    if (x === null || x < 0){ renderStage(); return; }
    var parts = d.fin.split('-'), idx = +parts[1];
    if (parts[0] === 'work') FIN.work[idx] = x;
    else FIN.rows.forEach(function(r){ if (r.k === parts[0]) r.d[idx] = x; });
    FIN.edited[d.fin] = true;
    renderStage(); return;
  }
  if (i.id === 'finAvans' || i.id === 'finDelay' || i.id === 'finHold'){
    x = num(i.value);
    if (x === null || x < 0){ renderStage(); return; }
    if (i.id === 'finAvans') FIN.avans = Math.min(x, 100);
    if (i.id === 'finDelay') FIN.delay = Math.min(x, 180);
    if (i.id === 'finHold')  FIN.hold  = Math.min(x, 30);
    renderStage();
  }
});

document.getElementById('markup').addEventListener('input', function(e){
  state.m = +e.target.value / 100;
  renderSummary();
  if (state.step === STEP.budget || state.step === STEP.fin) renderStage();
});
document.getElementById('contract').addEventListener('input', function(e){
  var C = mdl().C;
  var v = parseFloat(e.target.value.replace(/[^\d]/g,''));
  if (!v || v < C*1.15 || v > C*1.7) return;
  state.m = v / C - 1;
  document.getElementById('markup').value = (state.m*100).toFixed(1);
  renderSummary();
  if (state.step === STEP.budget || state.step === STEP.fin) renderStage();
});
document.getElementById('contract').addEventListener('blur', renderSummary);

document.getElementById('overlay').addEventListener('click', function(e){
  if (e.target.id === 'overlay'){ closeModal(); return; }
  var t;
  if (e.target.closest('[data-close]')){ closeModal(); return; }
  if ((t = e.target.closest('[data-send-req]'))){ saveRequests(t.dataset.sendReq, 'sent'); return; }
  if ((t = e.target.closest('[data-save-req]'))){ saveRequests(t.dataset.saveReq, 'draft'); return; }
  if ((t = e.target.closest('[data-req-st]'))){
    var v = t.dataset.reqSt.split('|'), id = +v[0];
    REQUESTS.forEach(function(r){
      if (r.id === id){ r.st = v[1]; r.resp = TODAY; }
    });
    closeModal(); renderAll(); return;
  }
});
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape' && !document.getElementById('overlay').hidden) closeModal();
});

/* ---- старт --------------------------------------------------------- */
MAT_REST = MAT_VSTR - (priceTotal() + buyTotal() + tendTotal());
renderAll();
})();
